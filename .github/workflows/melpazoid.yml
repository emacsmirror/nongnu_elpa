name: melpazoid

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Prepare melpazoid
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          git clone --depth 1 https://github.com/riscy/melpazoid.git "$RUNNER_TEMP/melpazoid"

      - name: Check package
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: '(markdown-ts-appear :fetcher github :repo "Thysrael/markdown-ts-appear")'
          EXIST_OK: "true"
          WARN_IS_ERROR: "false"
        run: make -C "$RUNNER_TEMP/melpazoid"
